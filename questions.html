<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tim is tuff</title>
  <link rel="icon" type="image/png" href="MYsatlogo.png">
  <link rel="shortcut icon" type="image/png" href="MYsatlogo.png">
  <link rel="apple-touch-icon" href="MYsatlogo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #fff; --border: #d8d5ce; --border-light: #ece9e2;
      --text: #1a1a1a; --text-muted: #6b6760; --text-light: #9b9690;
      --accent: #1a3a5c; --accent-light: #e8eff7;
      --correct: #08c0308e; --correct-bg: #eaf4ee; --correct-border: #02912b;
      --incorrect: #fd000086; --incorrect-bg: #faf0f0; --incorrect-border: #da00008f;
      --serif: 'Source Serif 4', Georgia, serif;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--sans); display: flex; flex-direction: column; background: var(--surface); color: var(--text); }

    .header { background: var(--accent); height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-back { color: rgba(255,255,255,0.75); font-size: 13px; text-decoration: none; padding: 5px 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); transition: all 0.15s; }
    .header-back:hover { background: rgba(255,255,255,0.12); color: white; }
    .header-section { font-size: 15px; font-weight: 600; color: white; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .calc-btn { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .calc-btn:hover { background: rgba(255,255,255,0.22); }

    .dashed { border: none; border-top: 2px dashed #ccc; flex-shrink: 0; width: 100%; margin: 0; }
    .content > .passage-panel + .question-panel { border-left: 1.5px solid #e0ddd7; }
    .content { flex: 1; display: flex; overflow: hidden; }

    /* LEFT PANEL */
    .passage-panel { flex: 0 0 50%; width: 50%; overflow-y: auto; overflow-x: hidden; padding: 40px 52px; min-width: 0; border-right: 1.5px solid #e0ddd7; scrollbar-width: none; -ms-overflow-style: none; }
    .passage-panel::-webkit-scrollbar { width: 0 !important; height: 0 !important; }
    .question-panel { flex: 0 0 50%; width: 50%; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .question-panel.single { flex: 1; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .content { flex: 1; display: flex; overflow: hidden; border-top: none; }
    .passage-panel + .question-panel { border-left: 1.5px solid #e0ddd7; }
    .passage-text { font-family: var(--serif); font-size: 16px; line-height: 1.85; color: var(--text); max-width: 100%; overflow-x: auto; text-align: left; }
    .passage-text figure, .passage-text p:has(svg), .passage-text p:has(img),
    .question-stem figure, .question-stem p:has(svg), .question-stem p:has(img) { text-align: center; }
    .passage-text p { margin-bottom: 14px; }
    .passage-text p:last-child { margin-bottom: 0; }
    .passage-text figure, .question-stem figure { margin: 16px 0; text-align: center; }
    .passage-text img, .question-stem img { max-width: 100%; height: auto; }
    .passage-text svg, .question-stem svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .passage-text table, .question-stem table { border-collapse: collapse; margin: 12px auto; font-family: var(--serif); font-size: 15px; }
    .passage-text th, .passage-text td, .question-stem th, .question-stem td { border: 1px solid #bbb; padding: 6px 18px; text-align: center; }
    .passage-text th, .question-stem th { background: #f0eeea; font-weight: 600; }
    
    /* RIGHT PANEL */
    .qnum-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; border-bottom: 1px solid var(--border-light); background: #faf9f7; flex-shrink: 0; }
    .qnum-left { display: flex; align-items: center; gap: 10px; }
    .qnum-box { width: 30px; height: 30px; background: var(--accent); color: white; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; transition: background 0.2s; }
    .mark-review { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 5px; transition: background 0.15s; user-select: none; }
    .mark-review:hover { color: var(--accent); background: rgba(0,0,0,0.05); }
    .mark-review.marked { color: #f5a623; background: rgba(245,166,35,0.1); font-weight: 600; }
    .diff-badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    .diff-E { background: #e8f5ec; color: #1a6b3a; }
    .diff-M { background: #fff4e0; color: #8b5e00; }
    .diff-H { background: #fdeaea; color: #8b1a1a; }
    .topic-tag { font-size: 11.5px; color: var(--text-light); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .retry-btn { padding: 10px 28px; background: transparent; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 6px; font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; align-self: center; width: fit-content; }
    .retry-btn:hover { background: var(--accent-light); }
    .action-area.centered .retry-btn { align-self: center; }

    /* BODY — two modes */
    .question-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 24px 12px; display: flex; flex-direction: column; gap: 18px; }
    .question-body.centered { align-items: center; padding-top: 24px; flex: 1; min-height: 0; overflow-y: auto; }
    .question-body.centered > * { width: 100%; max-width: 640px; }
    .question-stem { font-family: var(--serif); font-size: 16px; line-height: 1.75; color: var(--text); }
    .question-stem p { margin-bottom: 8px; }
    /* centered qnum bar sits in content flow */
    .qnum-bar.inline { background: #faf9f7; border: 1px solid var(--border-light); border-radius: 8px; padding: 10px 16px; margin-bottom: 2px; }

    /* CHOICES */
    .choices-list { display: flex; flex-direction: column; gap: 9px; }
    .choice { flex:1; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1.5px solid #d0cdc7; border-radius: 6px; cursor: pointer; transition: all 0.12s; background: var(--surface); position: relative; }
    .choice:hover:not(.disabled) { border-color: #4a7ab5; background: #f0f5fb; }
    .choice.selected  { border-color: var(--accent); background: #eaf0f8; }
    .choice.correct   { border-color: var(--correct-border); background: var(--correct-bg); }
    .choice.incorrect { border-color: var(--incorrect-border); background: var(--incorrect-bg); }
    .choice.disabled  { cursor: default; }
    /* crossed out */
    .choice.crossed { opacity: 1; background: var(--surface); border-color: #d0cdc7; }
    .choice.crossed { background: #f7f6f4; border-color: #d0cdc7; }
    .choice.crossed .choice-text { color: #aaa; }
    .choice.crossed .choice-letter { color: #bbb; border-color: #ccc; }
    .choice.crossed::after { content:''; position:absolute; left:-4px; right:-4px; top:50%; height:1.5px; background:#666; pointer-events:none; }
    .choice.crossed .choice-letter { color: var(--text-light); border-color: #ccc; position: relative; }
    .choice-letter { width: 28px; height: 28px; min-width: 28px; border-radius: 50%; border: 1.5px solid #aaa; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text-muted); transition: all 0.12s; flex-shrink: 0; }
    .choice.selected  .choice-letter { background: var(--accent);    border-color: var(--accent);    color: white; }
    .choice.correct   .choice-letter { background: var(--correct);   border-color: var(--correct);   color: white; }
    .choice.incorrect .choice-letter { background: var(--incorrect); border-color: var(--incorrect); color: white; }
    .choice-text { font-family: var(--serif); font-size: 15.5px; line-height: 1.5; color: var(--text); flex: 1; overflow: hidden; }
    /* cross-out button */
    .cross-btn { width: 28px; height: 28px; min-width: 28px; border-radius: 50%; border: 1.5px solid #aaa; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; font-weight: 600; line-height: 1; color: var(--text-muted); transition: all 0.12s; flex-shrink: 0; }
    .cross-btn:hover { border-color: #888; color: #555; }
    .choice.crossed .cross-btn { border: none; background: transparent; border-radius: 0; font-size: 13px; color: #444; text-decoration: underline; margin-left: 6px; }
    .choice.disabled .cross-btn { display: none; }

    .action-area { padding: 16px 24px 20px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
    .action-area.centered { align-items: center; display: flex; flex-direction: column; gap: 14px; }
    .action-area.centered > * { width: 100%; max-width: 640px; }
    .action-area.centered .retry-btn { align-self: center; width: fit-content; max-width: none; }
    .action-area.centered .rationale-box { width: 100%; max-width: 640px; }
    .submit-btn { padding: 10px 28px; background: var(--accent); color: white; border: none; border-radius: 6px; font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; align-self: flex-end; }
    .action-area.centered .submit-btn { align-self: center; padding: 10px 48px; }
    .action-area.centered { padding-top: 8px; }
    .submit-btn:hover:not(:disabled) { opacity: 0.85; }
    .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .rationale-box { border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; animation: fadeUp 0.2s ease; }
    .rationale-content { padding: 14px 16px; font-family: var(--serif); font-size: 14.5px; line-height: 1.75; max-height: 220px; overflow-y: auto; }
    .rationale-content p { margin-bottom: 8px; }
    .rationale-content p:last-child { margin-bottom: 0; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    .rationale-result { padding: 10px 14px; font-size: 13.5px; font-weight: 600; }
    .rationale-result.correct   { color: var(--correct);   background: var(--correct-bg);   border-bottom: 1px solid var(--correct-border); }
    .rationale-result.incorrect { color: var(--incorrect); background: var(--incorrect-bg); border-bottom: 1px solid var(--incorrect-border); }
    .rationale-content { padding: 14px 16px; font-family: var(--serif); font-size: 14.5px; line-height: 1.75; }
    .rationale-content p { margin-bottom: 8px; }
    .rationale-content p:last-child { margin-bottom: 0; }

    /* SPR */
    .spr-wrapper { display: flex; flex-direction: column; gap: 6px; }
    .spr-label { font-size: 13px; color: var(--text-muted); }
    .spr-hint { font-size: 11px; color: var(--text-light); margin-top: 2px; }

    /* BOTTOM BAR */
    .bottombar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; position: relative; }
    .bottombar-left { font-size: 13px; color: var(--text-muted); min-width: 80px; }
    .qpill { background: #1a1a1a; color: white; border: none; border-radius: 7px; padding: 8px 18px; font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; position: absolute; left: 50%; transform: translateX(-50%); }
    .qpill:hover { background: #333; }
    .bottombar-right { display: flex; gap: 8px; min-width: 80px; justify-content: flex-end; }
    .nav-btn { padding: 8px 22px; border-radius: 6px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: #4a7ab5; color: white; transition: opacity 0.15s; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-btn:hover:not(:disabled) { opacity: 0.85; }

    /* Q GRID */
    #qlistPopup { display: none; position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: white; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.18); z-index: 200; padding: 16px; min-width: 320px; max-width: 500px; }
    .qpopup-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-light); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); }
    .qgrid { display: flex; flex-direction: column; gap: 0; max-height: 320px; overflow-y: auto; }
    .qgrid-group { margin-bottom: 14px; }
    .qgrid-group-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); margin-bottom: 7px; padding-bottom: 5px; border-bottom: 1px solid var(--border-light); }
    .qgrid-group-items { display: flex; flex-wrap: wrap; gap: 9px; }
    .qgrid-item { width: 42px; height: 42px; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.12s; }
    .qgrid-item:hover { opacity: 0.75; transform: scale(1.06); }
    .qgrid-item.unanswered { background: white; color: var(--accent); border-color: var(--accent); }
    .qgrid-item.correct    { background: var(--correct);   color: white; border-color: var(--correct); }
    .qgrid-item.incorrect  { background: var(--incorrect); color: white; border-color: var(--incorrect); }
    .qgrid-item.current    { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(26,58,92,0.35); border-width: 3px !important; }

    /* LOADING */
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 14px; color: var(--text-muted); font-size: 14px; }
    .spinner { width: 30px; height: 30px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { padding: 24px 32px; color: var(--incorrect); font-size: 14px; }
    #pageLoader { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 999; font-family: var(--sans); font-size: 14px; color: var(--text-muted); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    .passage-panel::-webkit-scrollbar,
    .passage-panel *::-webkit-scrollbar { width: 0 !important; }
    .passage-panel::-webkit-scrollbar-thumb,
    .passage-panel *::-webkit-scrollbar-thumb { background: transparent !important; }

    /* MATH */
    .math-expr    { font-family: var(--serif); font-style: italic; display: inline; white-space: nowrap; }
    .math-var     { font-style: italic; }
    .math-num     { font-style: normal; }
    .math-op      { font-style: normal; padding: 0 0.18em; }
    .math-frac    { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; font-size: 0.85em; line-height: 1.15; margin: 0 0.15em; }
    .math-frac-n  { border-bottom: 1.2px solid currentColor; padding: 0 4px 1px; text-align: center; white-space: nowrap; }
    .math-frac-d  { padding: 1px 4px 0; text-align: center; white-space: nowrap; }
    .math-sup     { font-size: 0.72em; vertical-align: super; line-height: 0; margin-left: 0.04em; font-style: inherit; display: inline-block; transform: translateY(-0.15em); }
    .math-sup .math-frac { font-size: 0.85em; line-height: 1.15; }
    .math-sub     { font-size: 0.82em; vertical-align: sub; line-height: 0; margin-left: 0.02em; font-style: inherit; }
    .math-sub .math-frac { font-size: 1em; }
    .math-sqrt    { display: inline-flex; align-items: center; }
    .math-sqrt-sym  { font-style: normal; margin-right: 1px; font-size: 1.1em; line-height: 1; }
    .math-sqrt-body { border-top: 1.4px solid currentColor; padding: 0 2px; }
    .math-abs     { font-style: normal; }
    .math-paren   { font-style: normal; }
    .timer-display { display:flex; align-items:center; gap:5px; color:white; font-size:12.5px; font-family:var(--sans); font-weight:500; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); border-radius:5px; padding:5px 10px; transition:background 0.15s,border-color 0.15s; }
    .timer-display.frozen { background:rgba(135,165,200,0.24); border-color:rgba(205,222,240,0.62); }
    .timer-label { display:none; color:rgba(255,255,255,0.72); font-size:10.5px; font-weight:400; }
    .timer-display.frozen .timer-label { display:inline; }
    .passage-text p, .passage-text li, .passage-text ul, .passage-text ol { text-align: left !important; }
    .passage-text p:has(svg), .passage-text p:has(img), .passage-text figure { text-align: center !important; }
    .passage-text li { text-align: left !important; margin-bottom: 0 !important; line-height: 1.6; }
    .passage-text ul, .passage-text ol { margin: 0; padding-left: 32px; }
    .passage-text ul { border: none; }
    .passage-text p:has(.dap_copyright) { text-align: right !important; }
    .referenced-content,
    .passage-text u,
    .question-stem u,
    .choice-text u,
    .rationale-content u { text-decoration: underline !important; text-underline-offset: 2px; }
    button:focus-visible, .choice:focus-visible, .qgrid-item:focus-visible, .mark-review:focus-visible { outline: 3px solid #78a9e2; outline-offset: 2px; }
    .choice { width:100%; font:inherit; text-align:left; }
    .mark-review { border:0; background:transparent; font-family:var(--sans); }
    .qgrid-item { font-family:var(--sans); padding:0; }
    .shortcut-key { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:19px; padding:0 5px; border:1px solid currentColor; border-radius:4px; font-family:var(--sans); font-size:10px; font-weight:600; line-height:1; opacity:0.68; box-shadow:0 1px 0 rgba(0,0,0,0.12); }
    .choice .shortcut-key { margin-left:auto; flex-shrink:0; color:var(--text-muted); background:#f7f6f3; }
    .submit-btn, .nav-btn, .calc-btn, .mark-review, .qpill { align-items:center; gap:7px; }
    .submit-btn, .nav-btn, .qpill { display:flex; justify-content:center; }
  </style>
</head>
<body>

<div id="pageLoader"><div class="spinner"></div><span>loading questions…</span></div>

<div class="header">
  <div class="header-left">
    <a href="search.html" class="header-back">← back</a>
    <div style="display:flex;flex-direction:column;gap:1px;">
      <span class="header-section" id="headerSection">SAT</span>
      <span id="headerTopic" style="font-size:11px;color:rgba(255,255,255,0.55);font-family:var(--sans);"></span>
    </div>
  </div>
  <div class="header-right" id="headerRight"></div>
</div>

<hr class="dashed">
<div class="content" id="content"><div class="loading-state"><div class="spinner"></div></div></div>
<hr class="dashed">

<div class="bottombar">
  <div class="bottombar-left">made by tim</div>
  <button class="qpill" id="qPill" onclick="toggleQList()" title="Question list (Q)" aria-keyshortcuts="Q">Question — of — <kbd class="shortcut-key" aria-hidden="true">Q</kbd> ▾</button>
  <div class="bottombar-right">
    <button class="nav-btn" id="backBtn" onclick="goBack()" title="Previous question (Left Arrow)" aria-keyshortcuts="ArrowLeft" disabled><kbd class="shortcut-key" aria-hidden="true">←</kbd> Back</button>
    <button class="nav-btn" id="nextBtn" onclick="goNext()" title="Next question (Right Arrow)" aria-keyshortcuts="ArrowRight">Next <kbd class="shortcut-key" aria-hidden="true">→</kbd></button>
  </div>
</div>

<div id="qlistPopup">
  <div class="qpopup-title" id="qpopupTitle">questions</div>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);font-family:var(--sans);"><div style="width:18px;height:18px;border-radius:4px;background:var(--accent);border:2px solid var(--accent);box-shadow:0 0 0 2px rgba(26,58,92,0.25);"></div>current</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);font-family:var(--sans);"><div style="width:18px;height:18px;border-radius:4px;background:white;border:2px solid var(--accent);"></div>unanswered</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);font-family:var(--sans);"><div style="width:18px;height:18px;border-radius:4px;background:var(--correct);border:2px solid var(--correct);"></div>correct</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);font-family:var(--sans);"><div style="width:18px;height:18px;border-radius:4px;background:var(--incorrect);border:2px solid var(--incorrect);"></div>incorrect</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);font-family:var(--sans);"><div style="position:relative;width:18px;height:18px;border-radius:4px;background:white;border:2px solid var(--accent);overflow:visible;"><div style="position:absolute;top:-8px;right:-5px;width:14px;height:20px;background:white;padding:0 2px;border-radius:2px 2px 0 0;"><svg viewBox="0 0 24 24" fill="#f5a623" stroke="#e09010" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div></div>for review</div>
  </div>

<script>
  const API = 'https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/digital';
  const LETTERS = ['A','B','C','D','E','F'];
  const DIFF_LABEL = { E:'easy', M:'mid', H:'hard' };

  const params  = new URLSearchParams(window.location.search);
  const section = params.get('section') || 'math';
  const diffs   = new Set((params.get('diffs')||'').split(',').filter(Boolean));
  const topics  = new Set((params.get('topics')||'').split(',').filter(Boolean));

  let questions=[], currentIdx=0, currentQ=null;
  let submitted=false, selectedChoice=null, loadingQ=false, retrying=false;

  const FILTER_SIGNATURE = section+'|'+[...diffs].sort().join(',')+'|'+[...topics].sort().join(',');
  const STORAGE_SCOPE = 'sat_v3|'+window.location.pathname+'|'+FILTER_SIGNATURE;
  const SESSION_KEY = STORAGE_SCOPE+'|results';
  const ANSWER_KEY  = STORAGE_SCOPE+'|answers';
  const REVIEW_KEY  = STORAGE_SCOPE+'|reviews';
  const LAST_KEY    = STORAGE_SCOPE+'|last_question';
  const questionKey = q => String(q?.external_id||q?.externalId||q?.uId||q?.uid||q?.questionId||'');
  const getReviews   = () => { try { return JSON.parse(sessionStorage.getItem(REVIEW_KEY)||'{}'); } catch { return {}; } };
  const toggleReview = id => { const r=getReviews(); r[id]=!r[id]; sessionStorage.setItem(REVIEW_KEY,JSON.stringify(r)); };
  const clearReviews = () => sessionStorage.removeItem(REVIEW_KEY);
  const getResults = () => { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'{}'); } catch { return {}; } };
  const saveResult = (id,v) => { const r=getResults(); r[id]=v; sessionStorage.setItem(SESSION_KEY,JSON.stringify(r)); };
  const getAnswers = () => { try { return JSON.parse(sessionStorage.getItem(ANSWER_KEY)||'{}'); } catch { return {}; } };
  const getAnswer = id => getAnswers()[id] || null;
  const saveAnswer = (id,v) => { const a=getAnswers(); a[id]=v; sessionStorage.setItem(ANSWER_KEY,JSON.stringify(a)); };

  // ── MATH ────────────────────────────────────────────────────────────────────
  function cleanMathML(str) {
    if (!str) return str;
    return str.replace(/<math([^>]*)>[\s\S]*?<\/math>/gi, (full, attrs) => {
      const m = attrs.match(/alttext="([^"]*)"/i);
      if (m && m[1]) {
        let rendered = renderAlttext(m[1]);
        rendered = rendered.replace(/\bin\s*/g, '</span><span style="font-style:normal;">in </span><span class="math-expr">');
        return '<span class="math-expr">'+rendered+'</span>';
      }
      return full.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
    });
  }

  function renderAlttext(raw) {
    if (!raw) return '';

    // 1. Normalize surface tokens
    raw = raw.replace(/\bdegrees?\b/gi, '°');
    raw = raw.replace(/\bupper\s*([A-Za-z])\b/g, '$1');
    raw = raw.replace(/\bin\s*°([A-Za-z])/gi, 'in\u00A0°$1');
    raw = raw.replace(/\bcomma\b/gi, ',');

    // 2. Fix fused words inside parens, e.g. "8fluidounces" → "8 fluidounces"
    raw = raw.replace(/\(([^)]{3,80})\)/g, (m, inner) => {
      let f = inner.replace(/([a-zA-Z])([0-9])/g, '$1 $2')
                  .replace(/([0-9])([a-zA-Z])/g, '$1 $2')
                  .replace(/\band\b/gi, ' and ')
                  .replace(/\s{2,}/g, ' ');
      return '(' + f + ')';
    });

    // 3. Fused fraction words e.g. "sevenninths" → "seven ninths"
    raw = raw.replace(
      /\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)(halves|thirds?|fourths?|fifths?|sixths?|sevenths?|eighths?|ninths?|tenths?|elevenths?|twelfths?)\b/gi,
      '$1 $2'
    );

    // 4. Full lookup tables
    const ONES = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
      ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,
      seventeen:17,eighteen:18,nineteen:19};
    const TENS = {twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
    // all ordinals up to 100 + common large ones
    const ORDINALS = {};
    const ORD_ONES = ['','first','second','third','fourth','fifth','sixth','seventh','eighth',
      'ninth','tenth','eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth',
      'seventeenth','eighteenth','nineteenth'];
    const ORD_TENS = ['','','twentieth','thirtieth','fortieth','fiftieth','sixtieth',
      'seventieth','eightieth','ninetieth'];
    ORD_ONES.forEach((w,i) => { if (w) ORDINALS[w] = i; });
    ORD_TENS.forEach((w,i) => { if (w) ORDINALS[w] = i*10; });
    // compound: "twenty first" … "ninety ninth"
    const TENS_WORDS = ['twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
    TENS_WORDS.forEach((tw, ti) => {
      const base = (ti + 2) * 10;
      ORD_ONES.slice(1).forEach((ow, oi) => {
        ORDINALS[tw + ' ' + ow] = base + (oi + 1);      // "eighty fourth" → 84
        ORDINALS[tw + '-' + ow] = base + (oi + 1);      // "eighty-fourth" → 84
      });
    });
    ORDINALS['hundredth'] = 100; ORDINALS['thousandth'] = 1000;

    function wordToNum(w) {
      w = w.toLowerCase();
      return ONES[w] ?? TENS[w] ?? null;
    }
    function ordToNum(w) {
      return ORDINALS[w.toLowerCase()] ?? null;
    }

    // 5. Convert "negative" + fraction phrase early, before fraction conversion
    //    e.g. "negative one seventeenth" → "negative StartFraction 1 Over 17 EndFraction"
    //    handled naturally once we convert the fraction part below — just leave "negative" in place

    // 6. Convert word-fraction phrases → StartFraction N Over D EndFraction
    //    Supports 1–2 word numerators and 1–2 word denominators (handles up to 4-word phrases)
    raw = raw.replace(/\b(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|thirteenth|fourteenth|fifteenth|sixteenth|seventeenth|eighteenth|nineteenth|twentieth|thirtieth|fortieth|fiftieth|sixtieth|seventieth|eightieth|ninetieth|hundredth|thousandth)([a-rt-zA-RT-Z])/g, '$1 $2');
    const NUM_WORDS = 'zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety';
    const FRAC_RE = new RegExp(`\\b(negative\\s+)?((?:${NUM_WORDS})(?:\\s+(?:${NUM_WORDS}|[a-z]+-?(?:th|st|nd|rd)s?)){0,2})\\b`, 'gi');
    raw = raw.replace(FRAC_RE, (match, neg, rest) => {
      // neg may be undefined
      const prefix = neg ? 'negative ' : '';
      const words = rest.toLowerCase().split(/\s+/);
      if (words.length < 2 || words.length > 4) return match;

      for (let split = 1; split < words.length; split++) {
        const numWords = words.slice(0, split);
        const denWords = words.slice(split);

        // parse numerator
        let num = null;
        if (numWords.length === 1) {
          num = wordToNum(numWords[0]);
        } else if (numWords.length === 2) {
          const t = TENS[numWords[0]], o = ONES[numWords[1]];
          if (t !== undefined && o !== undefined) num = t + o;
        }
        if (num === null) continue;

        // parse denominator (try joined first for hyphenated like "eighty-fourth")
        let den = null;
        const denJoined = denWords.join(' ').replace(/s$/i, '');
        const denHyph   = denWords.join('-').replace(/s$/i, '');
        den = ordToNum(denJoined) ?? ordToNum(denHyph) ?? null;

        if (den === null && denWords.length === 2) {
          // fallback: "eighty fourth" split lookup already in ORDINALS via compound build above
          // try each part
          const t = TENS[denWords[0]];
          const o = ordToNum(denWords[1].replace(/s$/i,''));
          if (t !== undefined && o !== null) den = t + o;
        }

        if (num !== null && den !== null && den > 0) {
          return `${prefix}StartFraction ${num} Over ${den} EndFraction`;
        }
      }
      return match;
    });

    return parseMath(tokenizeMath(raw), 0).html;
  }

  function tokenizeMath(str) {
    const P = [
      ['StartFraction','START_FRAC'],['EndFraction','END_FRAC'],['Over','OVER'],
      ['StartAbsoluteValue','START_ABS'],['EndAbsoluteValue','END_ABS'],
      ['RootIndex',           'ROOT_IDX'],
      ['StartRoot','START_ROOT'],['EndRoot','END_ROOT'],
      ['Superscript','SUP'],['Subscript','SUB'],['Baseline','BASELINE'],
      ['left parenthesis','LPAREN'],['right parenthesis','RPAREN'],
      ['left bracket','LBRACKET'],['right bracket','RBRACKET'],
      ['left brace','LBRACE'],['right brace','RBRACE'],
      ['plus or minus','OP:±'],
      ['greater than or equal to','OP:≥'],
      ['greater than or equals','OP:≥'],
      ['greater than or equal','OP:≥'],
      ['less than or equal to','OP:≤'],
      ['less than or equals','OP:≤'],
      ['less than or equal','OP:≤'],
      ['not equal to','OP:≠'],
      ['greater than','OP:>'],['less than','OP:<'],['equals','OP:='],
      ['times','OP:×'],['divided by','OP:÷'],['minus','OP:−'],['plus','OP:+'],
      ['negative','NEG'],
      ['one tenth','WFRAC:1:10'],['one half','WFRAC:1:2'],['one third','WFRAC:1:3'],
      ['one fourth','WFRAC:1:4'],['one fifth','WFRAC:1:5'],['one sixth','WFRAC:1:6'],
      ['one seventh','WFRAC:1:7'],['one eighth','WFRAC:1:8'],['one ninth','WFRAC:1:9'],
      ['one twelfth','WFRAC:1:12'],['one hundredth','WFRAC:1:100'],
      ['two thirds','WFRAC:2:3'],['two fifths','WFRAC:2:5'],['two sevenths','WFRAC:2:7'],
      ['three fourths','WFRAC:3:4'],['three fifths','WFRAC:3:5'],['three halves','WFRAC:3:2'],
      ['four fifths','WFRAC:4:5'],['four thirds','WFRAC:4:3'],
      ['five halves','WFRAC:5:2'],['five thirds','WFRAC:5:3'],
      ['pi','VAR:π'],['infinity','VAR:∞'],['theta','VAR:θ'],
      ['alpha','VAR:α'],['beta','VAR:β'],['gamma','VAR:γ'],
      ['delta','VAR:δ'],['sigma','VAR:σ'],
      ['squared','SUP_LIT:2'],['cubed','SUP_LIT:3'],['comma','COMMA'],
      ['RootIndex', 'ROOT_IDX'],
      ['percent sign','PCT'],
      ['dollar sign','DOLLAR'],
    ];
    const BOUNDARY = new Set(['Over','comma','pi','minus','plus','times','equals',
      'negative','squared','cubed','infinity','theta','alpha','beta','gamma','delta','sigma']);

    let s = str.trim().replace(/\s+/g,' ');
    const toks = []; let i = 0;
    outer: while (i < s.length) {
      if (s[i]===' ') { i++; continue; }
      for (const [phrase, type] of P) {
        const len = phrase.length;
        if (s.substr(i,len).toLowerCase() !== phrase.toLowerCase()) continue;
        if (BOUNDARY.has(phrase)) { const a=s[i+len]; if (a!==undefined&&a!==' ') continue; }
        toks.push({type, val:phrase}); i+=len; continue outer;
      }
      const nm = s.substr(i).match(/^-?[0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?/);
      if (nm) { toks.push({type:'NUM', val:nm[0].replace(/,/g,'')}); i+=nm[0].length; continue; }
      if (/[a-zA-Z]/.test(s[i])) {
        const wm = s.substr(i).match(/^[a-zA-Z]+/);
        toks.push({type: wm[0].length===1?'VAR':'TEXT', val:wm[0]}); i+=wm[0].length; continue;
      }
      toks.push({type:'CHAR', val:s[i]}); i++;
    }
    return toks;
  }

  function parseMath(toks, start, stop) {
    let html='', i=start;
    while (i < toks.length) {
      const t = toks[i];
      if (stop && stop.includes(t.type)) break;
      const STOP_SUP = ['BASELINE','END_FRAC','RPAREN','END_ABS','END_ROOT'];
      if (t.type==='START_FRAC') {
        i++; const nr=parseMath(toks,i,['OVER','END_FRAC']); i=nr.end;
        if (toks[i]&&toks[i].type==='OVER') i++;
        const dr=parseMath(toks,i,['END_FRAC']); i=dr.end;
        if (toks[i]&&toks[i].type==='END_FRAC') i++;
        html+=`<span class="math-frac"><span class="math-frac-n">${nr.html}</span><span class="math-frac-d">${dr.html}</span></span>`; continue;
      }
      if (t.type==='SUP') { i++; const r=parseMath(toks,i,STOP_SUP); i=r.end; if(toks[i]&&toks[i].type==='BASELINE')i++; html+=`<span class="math-sup">${r.html}</span>`; continue; }
      if (t.type==='SUB') { i++; const r=parseMath(toks,i,STOP_SUP); i=r.end; if(toks[i]&&toks[i].type==='BASELINE')i++; html+=`<span class="math-sub">${r.html}</span>`; continue; }
      if (t.type==='START_ABS') { i++; const r=parseMath(toks,i,['END_ABS']); i=r.end; if(toks[i]&&toks[i].type==='END_ABS')i++; html+=`<span class="math-abs">|${r.html}|</span>`; continue; }
      if (t.type==='START_ROOT') { i++; const r=parseMath(toks,i,['END_ROOT']); i=r.end; if(toks[i]&&toks[i].type==='END_ROOT')i++; html+=`<span class="math-sqrt"><span class="math-sqrt-sym">√</span><span class="math-sqrt-body">${r.html}</span></span>`; continue; }
      if (t.type==='ROOT_IDX') {
        i++;
        const idxRes=parseMath(toks,i,['START_ROOT']);
        i=idxRes.end;
        if(toks[i]&&toks[i].type==='START_ROOT') i++;
        const bodyRes=parseMath(toks,i,['END_ROOT']);
        i=bodyRes.end;
        if(toks[i]&&toks[i].type==='END_ROOT') i++;
        html+=`<span class="math-sqrt"><span class="math-sqrt-sym" style="font-style:normal;">${idxRes.html}√</span><span class="math-sqrt-body">${bodyRes.html}</span></span>`;
        continue;
      }
      if (t.type==='ROOT_IDX') {
        // collect index number
        i++;
        const idxRes=parseMath(toks,i,['START_ROOT']);
        i=idxRes.end;
        if(toks[i]&&toks[i].type==='START_ROOT') i++;
        const bodyRes=parseMath(toks,i,['END_ROOT']);
        i=bodyRes.end;
        if(toks[i]&&toks[i].type==='END_ROOT') i++;
        html+=`<span class="math-sqrt"><span class="math-sqrt-sym" style="font-style:normal;">${idxRes.html}√</span><span class="math-sqrt-body">${bodyRes.html}</span></span>`;
        continue;
      }
      if (t.type.startsWith('WFRAC:')) { const [,n,d]=t.type.split(':'); html+=`<span class="math-frac"><span class="math-frac-n">${n}</span><span class="math-frac-d">${d}</span></span>`; i++; continue; }
      if (t.type==='SUP_LIT:2') { html+=`<span class="math-sup">2</span>`; i++; continue; }
      if (t.type==='SUP_LIT:3') { html+=`<span class="math-sup">3</span>`; i++; continue; }
      if (t.type==='NEG')      { html+=`<span class="math-op">−</span>`; i++; continue; }
      if (t.type==='LPAREN')   { html+=`<span class="math-paren">(</span>\u200B`; i++; continue; }
      if (t.type==='RPAREN')   { html+=`<span class="math-paren">)</span>`; i++; continue; }
      if (t.type==='LBRACKET') { html+=`<span class="math-paren">[</span>`; i++; continue; }
      if (t.type==='RBRACKET') { html+=`<span class="math-paren">]</span>`; i++; continue; }
      if (t.type==='LBRACE')   { html+=`<span class="math-paren">{</span>`; i++; continue; }
      if (t.type==='RBRACE')   { html+=`<span class="math-paren">}</span>`; i++; continue; }
      if (t.type==='COMMA')    { html+=`,`; i++; continue; }
      if (t.type==='VAR')      { html+=`<span class="math-var">${t.val}</span>`; i++; continue; }
      if (t.type==='NUM')      { const sp=i>0&&!['LPAREN','LBRACKET','LBRACE','START_ABS','NEG'].includes(toks[i-1]?.type)?' ':''; html+=sp+`<span class="math-num">${t.val}</span>`; i++; continue; }
      if (t.type==='TEXT')     { const sp=i>0&&!['LPAREN','LBRACKET','LBRACE','START_ABS'].includes(toks[i-1]?.type)?' ':''; html+=sp+`<span style="font-style:normal;">${t.val}</span>`; i++; continue; }
      if (t.type==='CHAR')     { html+=t.val; i++; continue; }
      if (t.type.startsWith('OP:'))  { html+=` <span class="math-op">${t.type.slice(3)}</span>`; i++; continue; }
      if (t.type==='PCT')    { html+=`<span class="math-op">%</span>`; i++; continue; }
      if (t.type==='DOLLAR') { html+=`<span class="math-op">$</span>`; i++; continue; }
      if (t.type.startsWith('VAR:')) { html+=`<span class="math-var">${t.type.slice(4)}</span>`; i++; continue; }
      if (t.type.startsWith('NUM:')) { html+=`<span class="math-num">${t.type.slice(4)}</span>`; i++; continue; }
      break;
    }
    return {html, end:i};
  }

  function cleanBlanks(str) {
  if (!str) return str;
  str = cleanMathML(str);

  // Work with real elements so visible content is never removed by a broad
  // regular expression. Referenced Content may be a span, div, or another tag.
  const sourceRoot=document.createElement('div');
  sourceRoot.innerHTML=str;
  sourceRoot.querySelectorAll('[aria-label]').forEach(node=>{
    const label=(node.getAttribute('aria-label')||'').trim().toLowerCase();
    if(label.startsWith('referenced content')){
      node.classList.add('referenced-content');
      node.removeAttribute('role');
    }
  });
  sourceRoot.querySelectorAll('[class*="sr-only"],[aria-label^="Long description" i]').forEach(node=>{
    if(!node.classList.contains('referenced-content')) node.remove();
  });
  sourceRoot.querySelectorAll('[role="region"]').forEach(node=>node.removeAttribute('role'));
  sourceRoot.querySelectorAll('[aria-hidden="true"]').forEach(node=>{
    if(!node.textContent.trim()&&!node.children.length) node.remove();
  });
  str=sourceRoot.innerHTML;

  // aria-hidden underscore blank lines
  str = str.replace(/<span[^>]*aria-hidden="true"[^>]*>_{3,}<\/span>/gi,
    '<span style="display:inline-block;min-width:60px;border-bottom:1.7px solid currentColor;vertical-align:+0.5em;margin:0 2px;">&nbsp;</span>');
  str = str.replace(/_{3,}/g,
    '<span style="display:inline-block;min-width:60px;border-bottom:1.7px solid currentColor;vertical-align:+0.5em;margin:0 2px;">&nbsp;</span>');

  // upper prefix — must run BEFORE degree replacement
  str = str.replace(/<i>upper([A-Za-z])<\/i>/gi, '<i>$1</i>');
  str = str.replace(/<span[^>]*>upper([A-Za-z])<\/span>/gi, '<span style="font-style:italic;">$1</span>');
  str = str.replace(/\bupper([A-Za-z])(?=[^a-z]|$)/g, '<span style="font-style:italic;">$1</span>');

  // degree symbol — AFTER upper strip so "°upperC" becomes "°C"
  str = str.replace(/\bdegrees?\b/gi, '°');
  str = str.replace(/°upper([A-Za-z])/gi, '°$1');
  str = str.replace(/<i>in\s*°([A-Za-z])<\/i>/gi, 'in °$1');

  // (X comma Y) → (X, Y)
  str = str.replace(/\(\s*([^)]*?)\s+comma\s+([^)]*?)\s*\)/gi, (m,a,b) => `(${a.trim()}, ${b.trim()})`);
  str = str.replace(/\bcomma\b/gi, ',');
  // fix fused unit conversion hints like (8fluidounces=1cup) — only inside parens, only between letter/digit boundaries
  str = str.replace(/\(([^)]{3,60})\)/g, (m, inner) => {
    let fixed = inner.replace(/([a-zA-Z])([0-9])/g, '$1 $2');
    fixed = fixed.replace(/([0-9])([a-zA-Z])/g, '$1 $2');
    fixed = fixed.replace(/\band\b/gi, ' and ');
    fixed = fixed.replace(/\s{2,}/g, ' ');
    return '(' + fixed + ')';
  });
  return str;
}

function formatNotes(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  // if CB already sent a ul, nothing to do
  if (div.querySelector('ul')) {
    const hasIntro = /while researching|following notes/i.test(html);
    if (!hasIntro) return `<p>While researching a topic, a student has taken the following notes:</p>` + html;
    return html;
  }
  const paras = [...div.querySelectorAll('p')];
  if (paras.length < 2) return html;
  const intro = paras[0].outerHTML;
  const items = paras.slice(1).map(p =>
    `<li>${p.innerHTML}</li>`
  ).join('');
  return intro + `<ul>${items}</ul>`;
}

  function sanitizeSPRInput(value) {
    return String(value||'')
      .replace(/\s+/g,'')
      .replace(/[^0-9./-]/g,'')
      .slice(0,5);
  }

  function parseSPRValue(value) {
    const text=String(value||'').trim();
    const fraction=text.match(/^(-?\d+)\/(\d+)$/);
    if(fraction){
      const denominator=Number(fraction[2]);
      if(!denominator) return null;
      return Number(fraction[1])/denominator;
    }
    if(!/^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(text)) return null;
    const number=Number(text);
    return Number.isFinite(number)?number:null;
  }

  function isCompleteSPRInput(value) {
    return parseSPRValue(value)!==null;
  }

  function isSPRCorrect(value,keys) {
    const answer=String(value||'').trim();
    const accepted=(keys||[]).map(key=>String(key).trim());
    if(accepted.includes(answer)) return true;

    const answerNumber=parseSPRValue(answer);
    if(answerNumber===null) return false;
    const close=(a,b)=>Math.abs(a-b)<1e-10;

    return accepted.some(key=>{
      const keyNumber=parseSPRValue(key);
      if(keyNumber===null) return false;
      if(close(answerNumber,keyNumber)) return true;

      // SAT grid-ins accept a repeating decimal when it is either truncated
      // or rounded to fit the available response boxes. Require at least
      // three decimal places so a rough approximation such as 0.7 is rejected.
      const decimalMatch=answer.match(/\.(\d+)$/);
      if(!decimalMatch||decimalMatch[1].length<3) return false;
      const places=decimalMatch[1].length;
      const factor=10**places;
      const truncated=Math.trunc(keyNumber*factor)/factor;
      const rounded=Math.sign(keyNumber)*Math.round(Math.abs(keyNumber)*factor)/factor;
      return close(answerNumber,truncated)||close(answerNumber,rounded);
    });
  }

  function formatSPRPreview(val) {
    let s = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // a^(b/c)
    s = s.replace(/([A-Za-z0-9.]+)\^\(([^)]+)\)/g, (m,base,exp) => {
      const fe = exp.replace(/(-?[A-Za-z0-9.]+)\/(-?[A-Za-z0-9.]+)/g,
        (_,n,d) => `<span class="math-frac" style="font-size:0.65em;"><span class="math-frac-n">${n}</span><span class="math-frac-d">${d}</span></span>`);
      return `${base}<span class="math-sup">${fe}</span>`;
    });
    // a^b
    s = s.replace(/([A-Za-z0-9.]+)\^([A-Za-z0-9.]+)/g, (m,b,e) => `${b}<span class="math-sup">${e}</span>`);
    // a/b — supports expressions in parens like x/(2x+3) or (x+1)/(x-1)
    s = s.replace(/(\([\s\S]*?\)|[A-Za-z0-9.]+)\/(\([\s\S]*?\)|[A-Za-z0-9.]+)/g,
      (m,n,d) => {
        // strip outer parens for display
        const nd = n.replace(/^\(|\)$/g,'');
        const dd = d.replace(/^\(|\)$/g,'');
        return `<span class="math-frac"><span class="math-frac-n">${nd}</span><span class="math-frac-d">${dd}</span></span>`;
      });
    return s;
  }

  const detailRequests=new Map();
  let questionLoadToken=0;

  class InvalidQuestionError extends Error {}

  function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

  async function postJson(path,body,retries=2){
    let lastError;
    for(let attempt=0;attempt<=retries;attempt++){
      try{
        const response=await fetch(`${API}/${path}`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
        if(!response.ok){
          const error=new Error(`request failed (${response.status})`);
          error.retryable=response.status===408||response.status===429||response.status>=500;
          throw error;
        }
        return await response.json();
      }catch(error){
        lastError=error;
        if(attempt>=retries||error.retryable===false) break;
        await wait(300*(2**attempt));
      }
    }
    throw lastError||new Error('request failed');
  }

  function hasUsableQuestion(data){
    if(!data||(!data.stem&&!data.stimulus)) return false;
    return data.type==='spr'||(Array.isArray(data.answerOptions)&&data.answerOptions.length>0);
  }

  async function getQuestionDetail(meta){
    if(meta._cached) return meta._cached;
    const id=questionKey(meta);
    if(detailRequests.has(id)) return detailRequests.get(id);

    const request=(async()=>{
      let data=null,firstError=null;
      try{data=await postJson('get-question',{external_id:meta.external_id});}
      catch(error){firstError=error;}

      const uid=meta.uId||meta.uid;
      if(!hasUsableQuestion(data)&&uid&&uid!==meta.external_id){
        try{data=await postJson('get-question',{external_id:uid});}
        catch(error){if(!firstError)firstError=error;}
      }

      if(!hasUsableQuestion(data)&&firstError) throw firstError;
      if(!hasUsableQuestion(data)) throw new InvalidQuestionError('question data is incomplete');
      meta._cached=data;
      meta._loadError=null;
      return data;
    })().catch(error=>{
      meta._loadError=error;
      throw error;
    }).finally(()=>detailRequests.delete(id));

    detailRequests.set(id,request);
    return request;
  }

  function prefetchQuestionDetails(startIdx){
    const order=[];
    for(let offset=1;offset<questions.length;offset++) order.push((startIdx+offset)%questions.length);
    let cursor=0;
    const worker=async()=>{
      while(cursor<order.length){
        const idx=order[cursor++];
        try{await getQuestionDetail(questions[idx]);}catch{}
      }
    };
    return Promise.all(Array.from({length:Math.min(6,order.length)},worker));
  }

    document.getElementById('pageLoader').remove();

  }

  async function loadQuestion(idx) {
    if(idx<0||idx>=questions.length)return;
    const token=++questionLoadToken;
    loadingQ=true; currentIdx=idx; submitted=false; selectedChoice=null; currentQ=null; retrying=false;
    updateNavBtns(); updateQPill(); renderGrid();
    document.getElementById('content').innerHTML='<div class="loading-state"><div class="spinner"></div><span>loading…</span></div>';
    try {
      const data=await getQuestionDetail(questions[idx]);
      if(token!==questionLoadToken)return;
      currentQ=data; renderQuestion();
    } catch(error){
      if(token!==questionLoadToken)return;
      renderQuestionLoadError(error);
    } finally {
      if(token===questionLoadToken)loadingQ=false;
    }
  }

  function renderQuestionLoadError(error){
    const content=document.getElementById('content');
    content.innerHTML='';
    const box=document.createElement('div');
    box.className='error-msg';
    const message=document.createElement('div');
    message.textContent=error instanceof InvalidQuestionError
      ? 'This question is missing required content.'
      : 'This question could not be loaded. Check your connection and try again.';
    const retry=document.createElement('button');
    retry.className='retry-btn';
    retry.textContent='Retry loading question';
    retry.title='Retry loading this question';
    retry.onclick=()=>loadQuestion(currentIdx);
    box.appendChild(message);
    box.appendChild(retry);
    content.appendChild(box);
  }

  function renderQuestion() {

  function pickChoice(i) {

  function correctChoiceIndices() {
    const opts=currentQ.answerOptions||[], cids=new Set(currentQ.keys||[]), cset=new Set();
    opts.forEach((o,i)=>{if(cids.has(o.id))cset.add(i);});

  function restoreAnswer(answer,isSPR) {
    submitted=true;
    selectedChoice=answer.selectedChoice??null;
    const isCorrect=answer.latestResult==='correct';

    if(isSPR){
      const inp=document.getElementById('sprInput');
      const pre=document.getElementById('sprPreview');
      if(inp){
        inp.value=answer.sprValue||'';
        inp.disabled=true;
        inp.style.borderColor=isCorrect?'var(--correct-border)':'var(--incorrect-border)';
        inp.style.background=isCorrect?'var(--correct-bg)':'var(--incorrect-bg)';
      }
      if(pre) pre.innerHTML=answer.sprValue?formatSPRPreview(answer.sprValue):'&nbsp;';
    } else {
      const cset=correctChoiceIndices();
      document.querySelectorAll('.choice').forEach((el,i)=>{
        el.classList.add('disabled');
        el.disabled=true;
        el.classList.remove('selected','crossed');
        if(cset.has(i)) el.classList.add('correct');
        else if(i===answer.selectedChoice) el.classList.add('incorrect');
      });
      document.querySelectorAll('.cross-btn').forEach(button=>{button.disabled=true;button.hidden=true;});
    }

      const cids=(currentQ.keys||[]).map(String);
      rationale+=`<p style="margin-top:8px;color:var(--text-muted);font-size:13px;">correct answer: <strong>${cids.join(' or ')}</strong></p>`;

  function retryQuestion() {
    submitted=false; selectedChoice=null; retrying=true;

    renderQuestion();

  function submitAnswer() {
    if(selectedChoice===null||submitted)return; submitted=true;
    const currentId=questionKey(questions[currentIdx]);
    const existing=getAnswer(currentId);
    const frozenSeconds=existing?.timeSeconds??freezeTimer();
    const cset=correctChoiceIndices();
    const ok=cset.has(selectedChoice);
    const result=ok?'correct':'incorrect';
    saveAnswer(currentId,existing
      ? {...existing,latestResult:result,selectedChoice,attempts:(existing.attempts||1)+1}
      : {firstResult:result,latestResult:result,selectedChoice,timeSeconds:frozenSeconds,attempts:1});
    saveResult(currentId,result);
    document.querySelectorAll('.choice').forEach((el,i)=>{
      el.classList.add('disabled'); el.disabled=true; el.classList.remove('selected','crossed');
      if(cset.has(i))el.classList.add('correct');
      else if(i===selectedChoice)el.classList.add('incorrect');
    });
    document.querySelectorAll('.cross-btn').forEach(button=>{button.disabled=true;button.hidden=true;});
    showResult(ok, cleanBlanks(currentQ.rationale||'<p>no explanation available.</p>'));
  }

  function submitSPR() {
    const inp=document.getElementById('sprInput'); if(!inp||submitted)return; submitted=true;
    const currentId=questionKey(questions[currentIdx]);
    const existing=getAnswer(currentId);
    const frozenSeconds=existing?.timeSeconds??freezeTimer();
    const val=sanitizeSPRInput(inp.value), cids=new Set((currentQ.keys||[]).map(String)), ok=isSPRCorrect(val,[...cids]);
    const result=ok?'correct':'incorrect';
    saveAnswer(currentId,existing
      ? {...existing,latestResult:result,sprValue:val,attempts:(existing.attempts||1)+1}
      : {firstResult:result,latestResult:result,sprValue:val,timeSeconds:frozenSeconds,attempts:1});
    saveResult(currentId,result);
    inp.disabled=true;
    inp.style.borderColor=ok?'var(--correct-border)':'var(--incorrect-border)';
    inp.style.background=ok?'var(--correct-bg)':'var(--incorrect-bg)';
    const note=ok?'':`<p style="margin-top:8px;color:var(--text-muted);font-size:13px;">correct answer: <strong>${[...cids].join(' or ')}</strong></p>`;
    showResult(ok, cleanBlanks(currentQ.rationale||'<p>no explanation available.</p>')+note);
  }

  function goBack(){if(currentIdx>0){stopTimer();loadQuestion(currentIdx-1);}}
  function goNext(){if(currentIdx<questions.length-1){stopTimer();loadQuestion(currentIdx+1);}}
  function updateNavBtns(){
    document.getElementById('backBtn').disabled=currentIdx===0;
    document.getElementById('nextBtn').disabled=currentIdx===questions.length-1;
  }
  function updateQPill(){
    document.getElementById('qPill').innerHTML=`Question ${currentIdx+1} of ${questions.length} <kbd class="shortcut-key" aria-hidden="true">Q</kbd> ▾`;
    sessionStorage.setItem(LAST_KEY,questionKey(questions[currentIdx]));
  }

  function renderGrid(){
    const grid=document.getElementById('qgrid'), res=getResults(), rev=getReviews();
    document.getElementById('qpopupTitle').textContent=`questions — ${Object.keys(res).length} answered of ${questions.length}`;
    grid.innerHTML='';
    const gs={},go=[];
    questions.forEach((q,i)=>{
      const sk=q.skill_desc||q.skillDesc||'other';
      if(!gs[sk]){gs[sk]=[];go.push(sk);}
      gs[sk].push({q,i});
    });
    go.forEach(sk=>{
      const g=document.createElement('div'); g.className='qgrid-group';
      const l=document.createElement('div'); l.className='qgrid-group-label'; l.textContent=sk;
      g.appendChild(l);
      const it=document.createElement('div'); it.className='qgrid-group-items';
      gs[sk].forEach(({q,i})=>{
        const el=document.createElement('button'); el.type='button';
        const id=questionKey(q),r=res[id];
        let cls='qgrid-item '+(r==='correct'?'correct':r==='incorrect'?'incorrect':'unanswered');
        if(i===currentIdx) cls+=' current';
        if(rev[id]) cls+=' review';
        el.className=cls;
        el.textContent=i+1;
        el.title=`Question ${i+1}: ${sk}`;
        if(rev[id]){
          const bm=document.createElement('div');
          bm.style.cssText='position:absolute;top:-10px;right:-8px;width:20px;height:28px;background:transparent;padding:0 2px;border-radius:4px 4px 0 0;';
          bm.innerHTML=`<svg viewBox="0 0 24 24" fill="#f5a623" stroke="#e09010" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
          el.appendChild(bm);
        }
        el.onclick=()=>{toggleQList();stopTimer();loadQuestion(i);};
        it.appendChild(el);
      });
      g.appendChild(it);
      grid.appendChild(g);
    });
  }

  let qlistOpen=false;
  function setQListOpen(open){
    qlistOpen=open;
    document.getElementById('qlistPopup').style.display=open?'block':'none';
    if(open)renderGrid();
  }
  function toggleQList(){
    setQListOpen(!qlistOpen);
  }
  document.addEventListener('click',e=>{
    if(qlistOpen&&!e.target.closest('#qlistPopup')&&!e.target.closest('#qPill'))setQListOpen(false);
  });

  function handleMarkReview(){
    const id=questionKey(questions[currentIdx]);
    toggleReview(id);
    const m=getReviews()[id], btn=document.getElementById('markReviewBtn');
    if(btn){
      btn.className=m?'mark-review marked':'mark-review';
      btn.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="${m?'#f5a623':'none'}" stroke="${m?'#f5a623':'currentColor'}" stroke-width="2.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> ${m?'marked for review':'mark for review'} <kbd class="shortcut-key" aria-hidden="true">M</kbd>`;
    }
    renderGrid();
  }

  function clearAllReviews(){
    clearReviews();
    const btn=document.getElementById('markReviewBtn');
    if(btn){btn.className='mark-review';btn.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> mark for review <kbd class="shortcut-key" aria-hidden="true">M</kbd>`;}
    renderGrid();
  }

  let calcOpen=false, calcExpanded=false;
  function setCalcOpen(open){
    calcOpen=open;
    const widget=document.getElementById('calcWidget');
    widget.style.display=open?'flex':'none';
    if(open)requestAnimationFrame(keepCalculatorGripVisible);
  }
  function toggleCalc(){setCalcOpen(!calcOpen);}
  function expandCalc(){
    calcExpanded=!calcExpanded;
    const w=document.getElementById('calcWidget'),ic=document.getElementById('expandIcon');
    if(calcExpanded){w.style.width='800px';w.style.height='670px';ic.innerHTML=`<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>`;}
    else{w.style.width='360px';w.style.height='600px';ic.innerHTML=`<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;}
    requestAnimationFrame(keepCalculatorGripVisible);
  }

  function placeCalculator(left,top){
    const w=document.getElementById('calcWidget'),h=document.getElementById('calcHandle');
    if(!w||!h||!w.offsetWidth)return;
    const margin=18,gripX=w.offsetWidth/2,gripY=h.offsetHeight/2;
    const minLeft=margin-gripX,maxLeft=window.innerWidth-margin-gripX;
    const minTop=margin-gripY,maxTop=window.innerHeight-margin-gripY;
    const x=Math.max(minLeft,Math.min(maxLeft,left));
    const y=Math.max(minTop,Math.min(maxTop,top));
    w.style.right='auto';w.style.bottom='auto';w.style.left=x+'px';w.style.top=y+'px';
  }

  function keepCalculatorGripVisible(){
    const w=document.getElementById('calcWidget');
    if(!w||!calcOpen)return;
    const rect=w.getBoundingClientRect();
    placeCalculator(rect.left,rect.top);
  }

  document.addEventListener('DOMContentLoaded',()=>{
    const h=document.getElementById('calcHandle'),w=document.getElementById('calcWidget');
    if(!h||!w)return;
    let drag=false,ox=0,oy=0;
    h.addEventListener('pointerdown',e=>{
      if(e.target.closest('button'))return;
      drag=true;
      const rect=w.getBoundingClientRect();
      ox=e.clientX-rect.left;oy=e.clientY-rect.top;
      h.setPointerCapture(e.pointerId);
      h.style.cursor='grabbing';
      e.preventDefault();
    });
    h.addEventListener('pointermove',e=>{if(drag)placeCalculator(e.clientX-ox,e.clientY-oy);});
    h.addEventListener('pointerup',e=>{drag=false;h.releasePointerCapture(e.pointerId);h.style.cursor='grab';});
    h.addEventListener('pointercancel',()=>{drag=false;h.style.cursor='grab';});
    window.addEventListener('resize',keepCalculatorGripVisible);
  });

  document.addEventListener('keydown',event=>{
    if(event.defaultPrevented||event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;
    const target=event.target;
    const typing=target instanceof HTMLElement&&target.matches('input,textarea,select,[contenteditable="true"]');
    const key=event.key.toLowerCase();

    if(typing)return;

    if(/^[1-4]$/.test(event.key)&&!submitted&&currentQ?.type!=='spr'){
      pickChoice(Number(event.key)-1);event.preventDefault();return;
    }
    if(event.key==='Enter'&&!target.closest('button,a')){
      const submit=document.getElementById('submitBtn');
      if(submit&&!submit.disabled){submit.click();event.preventDefault();}
      return;
    }
    if(key==='m'&&currentQ){handleMarkReview();event.preventDefault();return;}
    if(key==='c'&&section==='math'){toggleCalc();event.preventDefault();return;}
    if(key==='q'){toggleQList();event.preventDefault();return;}
    if(event.key==='ArrowLeft'&&currentIdx>0){setQListOpen(false);goBack();event.preventDefault();return;}
    if(event.key==='ArrowRight'&&currentIdx<questions.length-1){setQListOpen(false);goNext();event.preventDefault();}
  });

    // ── TIMER ───────────────────────────────────────────────────────────────────
  let timerSeconds=0, timerBaseSeconds=0, timerStartedAt=null, timerInterval=null;

  function startTimer(initialSeconds=0,frozen=false) {
    timerBaseSeconds=Number.isFinite(Number(initialSeconds))?Math.max(0,Math.floor(Number(initialSeconds))):0;
    timerSeconds=timerBaseSeconds;
    timerStartedAt=frozen?null:Date.now();
    clearInterval(timerInterval);
    timerInterval=null;
    setTimerFrozen(frozen);
    updateTimerDisplay();
    if(frozen) return;
    timerInterval=setInterval(updateTimerDisplay,1000);
  }

  function updateTimerDisplay() {
    const el=document.getElementById('timerDisplay');
    if(!el) return;
    timerSeconds=timerBaseSeconds+(timerStartedAt===null?0:Math.floor((Date.now()-timerStartedAt)/1000));
    const m=Math.floor(timerSeconds/60);
    const s=timerSeconds%60;
    el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  }

  function setTimerFrozen(frozen) {
    const display=document.querySelector('.timer-display');
    const label=document.getElementById('timerLabel');
    if(display) display.classList.toggle('frozen',frozen);
    if(label) label.textContent=frozen?'answered in':'';
  }

  function stopTimer() {
    updateTimerDisplay();
    clearInterval(timerInterval);
    timerInterval=null;
    timerBaseSeconds=timerSeconds;
    timerStartedAt=null;
  }
  function freezeTimer() { stopTimer(); setTimerFrozen(true); return timerSeconds; }
  boot();
</script>
</body>
</html>
